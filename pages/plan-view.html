<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="SYNAPTIQAI">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYNAPTIQAI">
<title>Study Plan — SYNAPTIQAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.view-grid { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 20px; }
@media (max-width: 1024px) { .view-grid { grid-template-columns: 1fr; } }
.day-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; background: var(--bg-surface); margin-bottom: 14px; }
.topic-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-md); margin-top: 8px; }
</style>
<link rel="icon" type="image/png" href="../img/synaptiq_logo_removebg.png">
<link rel="manifest" href="../manifest.json">
</head>
<body>

<div class="app-layout">
  <aside class="app-sidebar"></aside>
  <header class="app-topbar"></header>

  <main class="app-main">
    <!-- EMPTY / INVALID PLAN STATE -->
    <div id="planEmptyState" class="card" style="display:none; text-align:center; max-width:540px; margin:40px auto; padding:36px 20px;">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">📁</div>
      <h2 style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">No Study Plan Found</h2>
      <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 20px;">
        You have not selected an active plan or the plan ID is invalid.
      </p>
      <a href="plan-new.html" class="btn btn-primary">+ Create Study Plan</a>
    </div>

    <!-- ACTIVE PLAN VIEW WORKSPACE -->
    <div id="activePlanWorkspace" style="display:none;">
      <!-- PLAN HEADER -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 14px;">
        <div>
          <h1 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700;" id="planSubjectTitle">Study Plan</h1>
          <p style="color: var(--text-secondary); font-size: 0.875rem;" id="planMetaSub">Target Exam: Upcoming</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <a href="session.html" class="btn btn-primary" id="btnStartPlanSession">Start Study Session 🎯</a>
        </div>
      </div>

      <div class="view-grid">
        <!-- SCHEDULE DAYS -->
        <div>
          <h3 class="card-title" style="margin-bottom: 14px;">STUDY SCHEDULE & TOPICS</h3>
          <div id="daysContainer">
            <!-- Dynamic days rendered here -->
          </div>
        </div>

        <!-- SIDE METRICS -->
        <div>
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 14px;">PLAN OVERVIEW</h3>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                  <span>Plan Completion</span>
                  <span id="valCompletion">0%</span>
                </div>
                <div class="progress-bar-track"><div class="progress-bar-fill" id="barCompletion" style="width: 0%;"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { renderAppShell } from "../js/ui-components.js";
import { initTheme } from "../js/theme.js";
import { dbGet } from "../js/db.js";

initTheme();
renderAppShell("plan-new", "Plan Details");

const params = new URLSearchParams(window.location.search);
const planId = params.get("id");

async function loadPlanDetails() {
  if (!planId) {
    document.getElementById("planEmptyState").style.display = "block";
    document.getElementById("activePlanWorkspace").style.display = "none";
    return;
  }

  try {
    const plan = await dbGet("plans", planId);
    if (plan) {
      document.getElementById("planEmptyState").style.display = "none";
      document.getElementById("activePlanWorkspace").style.display = "block";

      const subjectName = plan.subject || plan.plan_name || "Study Plan";
      document.getElementById("planSubjectTitle").textContent = subjectName;
      document.getElementById("planMetaSub").textContent = `Target Exam: ${plan.examDate || "Upcoming"} • Created: ${plan.createdAt ? plan.createdAt.split('T')[0] : 'Recent'}`;
      document.getElementById("btnStartPlanSession").href = `session.html?topic=${encodeURIComponent(subjectName)}`;

      const container = document.getElementById("daysContainer");
      const days = plan.schedule || plan.days || [
        { dayNum: 1, topic: subjectName + " Core Concepts", duration: "30 mins", priority: "HIGH" },
        { dayNum: 2, topic: subjectName + " Practice & Application", duration: "45 mins", priority: "MEDIUM" }
      ];

      container.innerHTML = days.map((d, idx) => {
        const tName = d.topic || d.topic_name || subjectName;
        return `
          <div class="day-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <span class="badge badge-primary">DAY ${d.dayNum || d.day_number || idx + 1}</span>
              <span style="font-size: 0.8rem; color: var(--text-muted);">${d.duration || d.minutes ? (d.minutes + " mins") : "25 mins"}</span>
            </div>
            <div class="topic-item">
              <div>
                <div style="font-weight: 600; font-size: 0.9rem;">${tName}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Priority: ${d.priority || "MEDIUM"}</div>
              </div>
              <a href="session.html?topic=${encodeURIComponent(tName)}" class="btn btn-secondary btn-sm">Study Topic</a>
            </div>
          </div>
        `;
      }).join("");
    } else {
      document.getElementById("planEmptyState").style.display = "block";
      document.getElementById("activePlanWorkspace").style.display = "none";
    }
  } catch (e) {
    document.getElementById("planEmptyState").style.display = "block";
    document.getElementById("activePlanWorkspace").style.display = "none";
  }
}

loadPlanDetails();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
