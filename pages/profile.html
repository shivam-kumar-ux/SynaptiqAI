<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="SYNAPTIQAI">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYNAPTIQAI">
<title>Scholar Profile — SYNAPTIQAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.profile-grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
@media (max-width: 1024px) { .profile-grid { grid-template-columns: 1fr; } }
.avatar-large { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-elevated); color: var(--accent-primary); font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; border: 1px solid var(--border); }
</style>
<link rel="icon" type="image/png" href="../img/synaptiq_logo_removebg.png">
<link rel="manifest" href="../manifest.json">
</head>
<body>

<div class="app-layout">
  <aside class="app-sidebar"></aside>
  <header class="app-topbar"></header>

  <main class="app-main">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700;">Scholar Profile</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Manage your profile and learning preferences.</p>
      </div>
      <button class="btn btn-outline" id="btnHeaderLogout" style="color: var(--danger); border-color: var(--danger);">Logout 🚪</button>
    </div>

    <div class="profile-grid">
      <!-- SIDE AVATAR CARD -->
      <div>
        <div class="card" style="text-align: center; margin-bottom: 16px;">
          <div class="avatar-large" id="userAvatarInitials">SK</div>
          <h2 style="font-family: var(--font-heading); font-size: 1.1rem; font-weight: 600;" id="profDisplayName">Shivam Kumar</h2>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;" id="profDisplayEmail">shivam@example.com</p>
        </div>

        <div class="card">
          <h3 class="card-title" style="margin-bottom: 10px;">SESSION</h3>
          <button class="btn btn-secondary btn-sm" id="btnCardLogout" style="width: 100%; color: var(--danger);">Logout of Session</button>
        </div>
      </div>

      <!-- MAIN PROFILE EDIT FORM -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card">
          <h3 class="card-title" style="margin-bottom: 16px;">PERSONAL & ACADEMIC INFORMATION</h3>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group"><label class="form-label">FULL NAME</label><input type="text" class="input-text" id="profName" value="Shivam Kumar"></div>
            <div class="form-group"><label class="form-label">EMAIL ADDRESS</label><input type="email" class="input-text" id="profEmail" value="shivam@example.com" disabled style="opacity: 0.7;"></div>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title" style="margin-bottom: 16px;">STUDY PREFERENCES</h3>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label">EXPLANATION LEVEL</label>
              <select class="select-input" id="profExplanationLevel">
                <option value="Beginner">Beginner</option>
                <option value="Basic">Basic</option>
                <option value="Intermediate" selected>Intermediate</option>
                <option value="Advanced">Advanced</option>
                <option value="Exam Ready">Exam Ready</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">DAILY STUDY TARGET</label>
              <select class="select-input" id="profDailyHours">
                <option value="2">2 Hours / Day</option>
                <option value="3" selected>3 Hours / Day</option>
                <option value="4">4 Hours / Day</option>
              </select>
            </div>
          </div>

          <button class="btn btn-primary" id="btnSaveProfile">Save Profile Changes 💾</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { renderAppShell, showToast, formatErrorMessage } from "../js/ui-components.js";
import { initTheme } from "../js/theme.js";
import { logoutUser } from "../js/routes.js";
import { dbGet, dbPut } from "../js/db.js";

initTheme();
renderAppShell("profile", "Scholar Profile");

document.getElementById("btnHeaderLogout")?.addEventListener("click", logoutUser);
document.getElementById("btnCardLogout")?.addEventListener("click", logoutUser);

import { getCurrentUser } from "../js/auth.js";

async function loadProfileData() {
  try {
    const session = getCurrentUser();
    if (!session) return;
    const user = await dbGet("users", session.id);
    if (user) {
      document.getElementById("profName").value = user.name || "Scholar";
      document.getElementById("profEmail").value = user.email || "scholar@example.com";
      document.getElementById("profDisplayName").textContent = user.name || "Scholar";
      document.getElementById("profDisplayEmail").textContent = user.email || "scholar@example.com";
      
      const initials = (user.name || "S").split(" ").map(n => n[0]).join("").toUpperCase().slice(0, 2);
      document.getElementById("userAvatarInitials").textContent = initials || "SK";
    }
  } catch (e) {
    console.log("Using default profile values.", e);
  }
}
loadProfileData();

document.getElementById("btnSaveProfile")?.addEventListener("click", async () => {
  const name = document.getElementById("profName").value.trim();
  const level = document.getElementById("profExplanationLevel").value;

  try {
    await dbPut("settings", {
      id: "user_profile_preferences",
      explanationLevel: level,
      updatedAt: new Date().toISOString()
    });
    showToast("Profile preferences saved!", "success");
  } catch (err) {
    showToast(formatErrorMessage(err), "danger");
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
