<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — SYNAPTIQAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 16px; min-height: 100vh; background: var(--bg-primary); }
.signup-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 40px; width: 100%; max-width: 580px; box-shadow: var(--shadow-lg); }
.steps-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px; }
.step-dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
.step-dot.active { border-color: var(--accent-primary); color: var(--accent-primary); background: var(--accent-glow); }
.step-dot.done { border-color: var(--success); background: var(--success); color: var(--bg-primary); }
.step-line { flex: 1; height: 2px; background: var(--border); max-width: 60px; }
.step-line.done { background: var(--success); }
.step-panel { display: none; }
.step-panel.active { display: block; }
.exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.exam-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.exam-card.selected { border-color: var(--accent-primary); background: var(--accent-glow); }
.pill { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-full); font-size: 0.8rem; cursor: pointer; background: var(--bg-secondary); }
.pill.active { border-color: var(--accent-primary); background: var(--accent-glow); color: var(--accent-primary); font-weight: 600; }
.tags-wrap { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 48px; }
.tag { padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
.tag-strong { background: var(--accent-glow); color: var(--accent-primary); border: 1px solid var(--border-accent); }
.tag-weak { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
.loading-overlay { position: fixed; inset: 0; background: rgba(7, 11, 20, 0.9); backdrop-filter: blur(12px); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.loading-overlay.show { display: flex; }
</style>
<link rel="icon" type="image/png" href="../img/synaptiq_logo_removebg.png">
</head>
<body>

<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
  <img src="../img/synaptiq_logo_removebg.png" alt="SYNAPTIQ Logo" style="width: 42px; height: 42px;">
  <span style="font-family: var(--font-heading); font-size: 1.2rem; font-weight: 800; color: var(--accent-primary);">SYNAPTIQAI</span>
</div>

<div class="signup-card">
  <div class="steps-bar">
    <div class="step-dot active" id="sd1">1</div>
    <div class="step-line" id="sl1"></div>
    <div class="step-dot" id="sd2">2</div>
  </div>

  <!-- STEP 1: ACADEMIC PROFILE -->
  <div class="step-panel active" id="s1">
    <h3 style="font-family: var(--font-heading); font-size: 1.1rem; color: var(--accent-primary); margin-bottom: 4px;">ACADEMIC PROFILE</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Tell us about your studies</p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="form-group">
        <label class="form-label">CLASS / GRADE</label>
        <select class="select-input" id="inp-class">
          <option value="">Select...</option>
          <option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option>
          <option>Undergraduate</option><option>Postgraduate</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">BOARD / UNIVERSITY</label>
        <select class="select-input" id="inp-board">
          <option value="">Select...</option>
          <option>CBSE</option><option>ICSE</option><option>State Board</option><option>University</option><option>Other</option>
        </select>
      </div>
    </div>

    <div class="form-group"><label class="form-label">INSTITUTION</label><input type="text" class="input-text" id="inp-inst" placeholder="School or College name"></div>

    <label class="form-label">PREPARING FOR</label>
    <div class="exam-grid" id="examGrid">
      <div class="exam-card" onclick="toggleExam(this)"><input type="checkbox" value="School Exam" style="display:none">🎓 <div>SCHOOL EXAM</div></div>
      <div class="exam-card" onclick="toggleExam(this)"><input type="checkbox" value="College Exam" style="display:none">🏛 <div>COLLEGE EXAM</div></div>
      <div class="exam-card" onclick="toggleExam(this)"><input type="checkbox" value="Competitive Exam" style="display:none">🏆 <div>COMPETITIVE</div></div>
      <div class="exam-card" onclick="toggleExam(this)"><input type="checkbox" value="Skill Development" style="display:none">💡 <div>SKILL DEV</div></div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
      <button class="btn btn-primary" onclick="goStep(2)">NEXT: PREFERENCES →</button>
    </div>
  </div>

  <!-- STEP 2: STUDY PREFERENCES -->
  <div class="step-panel" id="s2">
    <h3 style="font-family: var(--font-heading); font-size: 1.1rem; color: var(--accent-primary); margin-bottom: 4px;">STUDY PREFERENCES</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Configure your baseline targets</p>

    <div class="form-group">
      <label class="form-label">DAILY STUDY HOURS</label>
      <div style="display: flex; align-items: center; gap: 16px;">
        <input type="range" id="hoursSlider" min="1" max="12" value="3" oninput="document.getElementById('hVal').textContent=this.value+'h'" style="flex:1;">
        <span id="hVal" style="font-family: var(--font-mono); font-weight: 700; color: var(--accent-primary);">3h</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">STRONG SUBJECTS</label>
      <div class="tags-wrap" id="strong-wrap">
        <input type="text" class="input-text" id="strong-input" placeholder="Type subject + Enter" style="border:none; padding:4px;" onkeydown="addTag(event,'strong')">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">WEAK SUBJECTS</label>
      <div class="tags-wrap" id="weak-wrap">
        <input type="text" class="input-text" id="weak-input" placeholder="Type subject + Enter" style="border:none; padding:4px;" onkeydown="addTag(event,'weak')">
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button class="btn btn-secondary" onclick="goStep(1)" style="flex:1;">← BACK</button>
      <button class="btn btn-primary" onclick="submitSignup()" style="flex:1;">COMPLETE PROFILE 🚀</button>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div style="width:50px; height:50px; border:3px solid var(--border); border-top-color:var(--accent-primary); border-radius:50%; animation:spin 1s linear infinite;"></div>
  <div style="font-family:var(--font-mono); color:var(--accent-primary);">BUILDING YOUR LEARNER GRAPH...</div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<script type="module">
import { saveFullProfile, getCurrentUser, requireAuth } from "../js/auth.js";
import { initTheme } from "../js/theme.js";
initTheme();
requireAuth();

window.strongTags = [];
window.weakTags = [];

window.toggleExam = (el) => el.classList.toggle('selected');

window.addTag = (e, type) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const inp = document.getElementById(type + '-input');
  const val = inp.value.trim();
  if (!val) return;
  const arr = type === 'strong' ? window.strongTags : window.weakTags;
  arr.push(val);
  const wrap = document.getElementById(type + '-wrap');
  const tag = document.createElement('div');
  tag.className = 'tag tag-' + type;
  tag.innerHTML = `${val} <span style="cursor:pointer" onclick="this.parentElement.remove()">✕</span>`;
  wrap.insertBefore(tag, inp);
  inp.value = '';
};

window.goStep = (n) => {
  document.querySelectorAll('.step-panel').forEach((p, i) => p.classList.toggle('active', i === n - 1));
  ['sd1','sd2'].forEach((id, i) => {
    const el = document.getElementById(id);
    if(el) {
      el.classList.toggle('active', i === n - 1);
      el.classList.toggle('done', i < n - 1);
    }
  });
  ['sl1'].forEach((id, i) => {
    const el = document.getElementById(id);
    if(el) el.classList.toggle('done', i < n - 1);
  });
};

window.submitSignup = async () => {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('show');

  try {
    const session = getCurrentUser();
    if(!session) throw new Error("No active session");

    const profile = {
      classGrade: document.getElementById('inp-class').value,
      board: document.getElementById('inp-board').value,
      institution: document.getElementById('inp-inst').value,
      dailyHours: parseInt(document.getElementById('hoursSlider').value),
      strongSubjects: window.strongTags,
      weakSubjects: window.weakTags,
      onboardingCompleted: true
    };
    
    await saveFullProfile(session.id, profile);
    overlay.classList.remove('show');
    window.location.href = 'dashboard.html';
  } catch (err) {
    overlay.classList.remove('show');
    alert(err.message || 'Error saving profile.');
  }
};
</script>
</body>
</html>
