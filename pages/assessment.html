<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="SYNAPTIQAI">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYNAPTIQAI">
<title>Diagnostic Assessment — SYNAPTIQAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
.assess-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; max-width: 620px; margin: 20px auto; }
</style>
<link rel="icon" type="image/png" href="../img/synaptiq_logo_removebg.png">
<link rel="manifest" href="../manifest.json">
</head>
<body>

<div class="app-layout">
  <aside class="app-sidebar"></aside>
  <header class="app-topbar"></header>

  <main class="app-main">
    <div class="assess-card">
      <span class="badge badge-warning" style="margin-bottom: 10px;">EXAMINATION MODE</span>
      <h1 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; margin-bottom: 10px;">Diagnostic Assessment</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;">
        Evaluates conceptual understanding, application ability, and recall speed across active subjects.
      </p>

      <div style="background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px;">
        <h3 style="font-size: 0.85rem; font-weight: 600; color: var(--accent-primary); margin-bottom: 8px;">ASSESSMENT RULES</h3>
        <ul style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; padding-left: 18px;">
          <li>Once initiated, the test session timer runs continuously.</li>
          <li>Knowledge Graph scores adapt dynamically based on your answers.</li>
        </ul>
      </div>

      <button class="btn btn-primary btn-lg" style="width: 100%;" id="btnStartAssess">Initiate Assessment 📝</button>
    </div>
  </main>
</div>

<script type="module">
import { renderAppShell, showToast } from "../js/ui-components.js";
import { initTheme } from "../js/theme.js";

initTheme();
renderAppShell("assessment", "Assessment");

document.getElementById("btnStartAssess")?.addEventListener("click", () => {
  showToast("Diagnostic Assessment initiated!", "info");
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
