<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="application-name" content="SYNAPTIQAI">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYNAPTIQAI">
<title>Login — SYNAPTIQAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body { display:flex; align-items:center; justify-content:center; padding:20px; min-height:100vh; background:var(--bg-primary); }
.login-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px; width:100%; max-width:420px; box-shadow:var(--shadow-md); }
.logo-wrap { text-align:center; margin-bottom:24px; }
.logo-wrap img { width:48px; height:48px; margin-bottom:8px; }
.logo-title { font-family:var(--font-heading); font-weight:700; font-size:1.15rem; color:var(--text-primary); letter-spacing:1px; }
.err-box { background:rgba(239,68,68,.1); border:1px solid var(--danger,#ef4444); border-radius:8px; padding:10px 14px; font-size:0.85rem; color:var(--danger,#ef4444); margin-bottom:14px; display:none; }
.err-box.show { display:block; }
.suc-box { background:rgba(34,197,94,.1); border:1px solid #22c55e; border-radius:8px; padding:10px 14px; font-size:0.85rem; color:#22c55e; margin-bottom:14px; display:none; }
.suc-box.show { display:block; }
.divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--text-muted); font-size:0.8rem; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
.sec { display:none; }
.sec.active { display:block; }
.pw-wrap { position:relative; }
.pw-wrap input { padding-right:44px; width:100%; box-sizing:border-box; }
.pw-toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:1rem; padding:2px 6px; }
</style>
<link rel="icon" type="image/png" href="../img/synaptiq_logo_removebg.png">
<link rel="manifest" href="../manifest.json">
</head>
<body>

<div class="login-card">
  <div class="logo-wrap">
    <img src="../img/synaptiq_logo_removebg.png" alt="SYNAPTIQ Logo">
    <div class="logo-title">SYNAPTIQAI</div>
    <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:2px">Welcome back, Scholar.</div>
  </div>

  <div class="err-box" id="errBox"></div>
  <div class="suc-box" id="sucBox"></div>

  <!-- LOGIN SECTION -->
  <div class="sec active" id="secLogin">
    <div style="text-align:center;margin-bottom:16px">
      <p style="color:var(--text-secondary);font-size:0.875rem;margin-bottom:16px">Use your Google Account to securely access SynaptiqAI across all devices.</p>
      <div id="googleBtnContainer" style="display:flex;justify-content:center;min-height:44px"></div>
    </div>

    <div class="divider">or sign in with email</div>

    <div class="form-group">
      <label class="form-label">EMAIL ADDRESS</label>
      <input type="email" class="input-text" id="inp-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">PASSWORD</label>
      <div class="pw-wrap">
        <input type="password" class="input-text" id="inp-pw" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="togglePw" title="Show/hide">👁</button>
      </div>
    </div>

    <div style="text-align:right;margin-bottom:14px">
      <a href="#" id="forgotLink" style="color:var(--text-muted);font-size:0.8rem">Forgot password?</a>
    </div>

    <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-bottom:14px">Sign In</button>

    <div style="text-align:center;font-size:0.85rem;color:var(--text-secondary)">
      New scholar? <a href="register.html" style="color:var(--accent-primary);font-weight:600">Create Account</a>
    </div>
  </div>

  <!-- FORGOT PASSWORD SECTION -->
  <div class="sec" id="secForgot">
    <h3 style="font-family:var(--font-heading);font-size:0.95rem;color:var(--text-primary);margin-bottom:10px">Reset Password</h3>
    <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:14px">SynaptiqAI is local-first. We'll look up your account and explain your options.</p>
    <div class="form-group">
      <label class="form-label">EMAIL ADDRESS</label>
      <input type="email" class="input-text" id="reset-email" placeholder="you@example.com">
    </div>
    <button class="btn btn-primary" id="resetBtn" style="width:100%;margin-bottom:12px">Check Account</button>
    <div style="text-align:center">
      <a href="#" id="backToLoginLink" style="color:var(--text-secondary);font-size:0.8rem">← Back to Login</a>
    </div>
  </div>
</div>

<script type="module">
import { initializeGoogleAuth, loginWithEmail, sendPasswordReset, isAuthenticated } from '../js/auth.js';
import { initTheme } from '../js/theme.js';

initTheme();

// Already logged in — redirect
if (isAuthenticated()) { window.location.href = 'dashboard.html'; }

function showErr(msg) {
  const b = document.getElementById('errBox');
  b.textContent = msg; b.classList.add('show');
  document.getElementById('sucBox').classList.remove('show');
  setTimeout(() => b.classList.remove('show'), 6000);
}
function showSuc(msg) {
  const b = document.getElementById('sucBox');
  b.textContent = msg; b.classList.add('show');
  document.getElementById('errBox').classList.remove('show');
}
function showSec(id) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('errBox').classList.remove('show');
  document.getElementById('sucBox').classList.remove('show');
}

// Initialize Google Auth button
initializeGoogleAuth('googleBtnContainer', (res) => {
  if (res.success) {
    window.location.href = res.onboardingCompleted ? 'dashboard.html' : 'signup.html';
  } else {
    showErr(res.error || 'Google login failed. Check your OAuth Client ID in Settings.');
  }
});

// Password toggle
document.getElementById('togglePw')?.addEventListener('click', () => {
  const el = document.getElementById('inp-pw');
  el.type = el.type === 'password' ? 'text' : 'password';
});

// Email login
async function doEmailLogin() {
  const email = document.getElementById('inp-email').value.trim();
  const pw = document.getElementById('inp-pw').value;
  if (!email || !pw) return showErr('Please enter your email and password.');

  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Signing in…';
  btn.disabled = true;

  const res = await loginWithEmail(email, pw);

  btn.textContent = 'Sign In';
  btn.disabled = false;

  if (res.success) {
    window.location.href = res.onboardingCompleted ? 'dashboard.html' : 'signup.html';
  } else {
    showErr(res.error);
  }
}

document.getElementById('loginBtn')?.addEventListener('click', doEmailLogin);
document.getElementById('inp-pw')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doEmailLogin();
});

// Forgot password
document.getElementById('forgotLink')?.addEventListener('click', (e) => {
  e.preventDefault(); showSec('secForgot');
});
document.getElementById('backToLoginLink')?.addEventListener('click', (e) => {
  e.preventDefault(); showSec('secLogin');
});
document.getElementById('resetBtn')?.addEventListener('click', async () => {
  const email = document.getElementById('reset-email').value.trim();
  const res = await sendPasswordReset(email);
  if (res.success) showSuc(res.message);
  else showErr(res.error);
});
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
